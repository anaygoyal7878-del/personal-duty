<body>
<div class="app">

    </div>
  </header>
  <div class="world" id="world">

</div>

<script>
(function () {
  "use strict";
  const UI = GAME.ui;
  const RES = ["money", "time", "health", "duty"];
  /* Costs hit harder than the raw numbers so it is easier to lose. The shown changes use these scaled values. */
  GAME.encounters.forEach(e => e.choices.forEach(c => RES.forEach(k => { if (c.fx[k] < 0) c.fx[k] = Math.round(c.fx[k] * TUNING.cost); })));
  const ENC = GAME.encounters;
  const SPACING = TUNING.spacing, FIRST = TUNING.firstAt;
  const encX = i => FIRST + i * SPACING;
  const END_X = encX(ENC.length - 1) + 650;
  /* World x where each section starts (section 5 is TODAY). */
  const SECTION_START = [0, encX(1) - 400, encX(2) - 400, encX(4) - 400, encX(6) - 400, encX(8) - 380];
  const GROUND = 470; /* design units, screen is 600 units tall */

  /* ================= State ================= */

  const mainCtx = canvas.getContext("2d");

  const worldEl = document.getElementById("world");
  const layer = document.getElementById("layer");
  let S, viewW = 0, viewH = 0, dpr = 1, k = 1;
  let hurrying = false, dir = 0;
  function fresh() {
    return { mode: "start", char: null, name: UI.defaultName,
      res: { money: 70, time: 70, health: 70, duty: 70 },
      x: 0, next: 0, picks: [], jury: null, section: 0, shiftAt: -1e9, mul: 1, dustAcc: 0, walk: 0, cardAt: 0, sel: 0, locked: false, face: 1, faceVis: 1, proceed: null, moved: false, jy: 0, jv: 0, landAt: -1e9, landSeen: -1e9, react: null, alertAt: 0, alertFor: -1, camLead: null, lastStep: 0 };
  }

  /* ================= Helpers ================= */
  const $ = id => document.getElementById(id);
  function h(tag, cls, html) { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function fxText(key, d) { return UI.resourcesShort[key] + " " + (d > 0 ? "+" : "−") + Math.abs(d); }
  function sectionAt(x) { let s = 0; for (let i = 0; i < SECTION_START.length; i++) if (x >= SECTION_START[i]) s = i; return s; }

  /* ================= Portraits ================= */
  const N = "#1c2a44", E = "#e8d9b6", R = "#b5402c", BR = "#8a6a44";
  const PORTRAIT = {
    farmer: '<svg viewBox="0 0 80 80"><rect width="80" height="80" fill="' + E + '"/><path d="M16 80c0-15 10-24 24-24s24 9 24 24z" fill="#5f7a52"/><circle cx="40" cy="41" r="12" fill="#f0d0a8"/><ellipse cx="40" cy="31" rx="21" ry="4.5" fill="#d6ad5c"/><path d="M30 31c0-9 4-13 10-13s10 4 10 13z" fill="#d6ad5c"/><path d="M67 34v46M61 24v10h12V24M67 24v10" fill="none" stroke="' + N + '" stroke-width="3" stroke-linecap="round"/></svg>',
    shopkeeper: '<svg viewBox="0 0 80 80"><rect width="80" height="80" fill="' + E + '"/><path d="M16 80c0-15 10-24 24-24s24 9 24 24z" fill="#3c4a68"/><path d="M31 60h18v20H31z" fill="#fbf6ea"/><circle cx="40" cy="41" r="12" fill="#f0d0a8"/><circle cx="35.5" cy="42" r="3" fill="none" stroke="' + N + '" stroke-width="1.5"/><circle cx="44.5" cy="42" r="3" fill="none" stroke="' + N + '" stroke-width="1.5"/><path d="M21 33L40 20l19 13q-19 -5 -38 0z" fill="' + N + '"/></svg>',
    merchant: '<svg viewBox="0 0 80 80"><rect width="80" height="80" fill="' + E + '"/><path d="M16 80c0-15 10-24 24-24s24 9 24 24z" fill="#2e4a6e"/>' +
      '<path d="M30 58l10 22M50 58L40 80" stroke="#1f3350" stroke-width="2"/><path d="M34 56l6 13 6-13z" fill="#fbf6ea"/>' +
      '<circle cx="37" cy="74" r="1.8" fill="#D4AF37"/><circle cx="43" cy="74" r="1.8" fill="#D4AF37"/>' +
      '<circle cx="40" cy="41" r="12" fill="#f0d0a8"/><path d="M27 40c0-11 6-15 13-15s13 4 13 15c-2-4-5-7-13-7s-11 3-13 7z" fill="#f1eee6"/>' +
      '<circle cx="27" cy="43" r="4.5" fill="#f1eee6"/><circle cx="53" cy="43" r="4.5" fill="#f1eee6"/>' +
      '<path d="M66 51l4 29" stroke="#5a3d2a" stroke-width="3" stroke-linecap="round"/><circle cx="66" cy="50" r="3.2" fill="#D4AF37"/></svg>'
  };

  /* ================= Palettes per section ================= */
  const PAL = [
    { skyA: "#bfe0ec", skyB: "#f6ecd4", hill: "#b9cc8f", hill2: "#a6bd7c", ground: "#9dbb66", road: "#dcc493", edge: "#c6ab76" },
    { skyA: "#c6e2ea", skyB: "#f5ead2", hill: "#b4c78e", hill2: "#9fb77b", ground: "#98b666", road: "#d5bd8e", edge: "#bfa274" },
    { skyA: "#f1cfa0", skyB: "#f8ead0", hill: "#c9b98a", hill2: "#b5a778", ground: "#a3b468", road: "#d2b88a", edge: "#b99c6d" },
    { skyA: "#cbdce7", skyB: "#f3ead8", hill: "#b1c2a0", hill2: "#9db08d", ground: "#96b16c", road: "#c79a7a", edge: "#a97c5f" },
    { skyA: "#c3d3e2", skyB: "#efe7d6", hill: "#a9b9a6", hill2: "#96a894", ground: "#92ad6e", road: "#bd9377", edge: "#9d765d" },
    { skyA: "#8cc9ef", skyB: "#e4f3fb", hill: "#a8cfa8", hill2: "#8fbf93", ground: "#86c06d", road: "#5d636b", edge: "#d9d9d4" }
  ];
  function mix(a, b, t) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const r = Math.round(((pa >> 16) & 255) * (1 - t) + ((pb >> 16) & 255) * t);
    const g = Math.round(((pa >> 8) & 255) * (1 - t) + ((pb >> 8) & 255) * t);
    const bl = Math.round((pa & 255) * (1 - t) + (pb & 255) * t);
    return "rgb(" + r + "," + g + "," + bl + ")";
  }
  function paletteAt(x) {
    const s = sectionAt(x);
    const nextStart = SECTION_START[s + 1];
    const t = nextStart ? clamp((x - (nextStart - 350)) / 350, 0, 1) : 0;
    const A = PAL[s], B2 = PAL[Math.min(s + 1, PAL.length - 1)];
    const out = {}; Object.keys(A).forEach(key => out[key] = t > 0 ? mix(A[key], B2[key], t) : A[key]);
    return out;
  }

  /* ================= Scenery (generated once) ================= */
  const DECOR = [];
  (function buildDecor() {
    let seed = 11; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const busy = x => ENC.some((e, i) => Math.abs(encX(i) - x) < 260) || SECTION_START.some((g, i) => i > 0 && Math.abs(g - x) < 140);
    for (let x = -200; x < END_X + 1400; x += 110 + rnd() * 120) {
      if (busy(x)) continue;
      const s = sectionAt(x), r = rnd();
      let type;
      if (s === 0) type = r < .45 ? "tree" : r < .7 ? "fence" : r < .85 ? "hay" : "cow";
      else if (s === 5) type = r < .35 ? "tower" : r < .55 ? "tree" : r < .75 ? "lamp" : r < .9 ? "person" : "car";
      else if (s >= 3) type = r < .4 ? "row" : r < .6 ? "tree" : r < .8 ? "person" : "lampOld";
      else type = r < .4 ? "house" : r < .65 ? "tree" : r < .85 ? "person" : "fence";
      DECOR.push({ x, type, s, v: rnd(), h: rnd() });
    }
  })();

  /* ================= Drawing primitives ================= */
  function rr(x, y, w, hh, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + hh, r); ctx.arcTo(x + w, y + hh, x, y + hh, r); ctx.arcTo(x, y + hh, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function box(x, y, w, hh, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, hh); }
  function circ(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
  function poly(pts, c) { ctx.fillStyle = c; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fill(); }
  function softShadow(x, w) { ctx.fillStyle = "rgba(40,50,30,.16)"; ctx.beginPath(); ctx.ellipse(x, GROUND + 4, w / 2, 7, 0, 0, Math.PI * 2); ctx.fill(); }
  function label(x, y, text) {
    ctx.font = "800 13px system-ui, -apple-system, Segoe UI, sans-serif";
    const w = ctx.measureText(text).width + 22;
    ctx.fillStyle = "rgba(28,42,68,.9)"; rr(x - w / 2, y - 13, w, 26, 13); ctx.fill();
    ctx.fillStyle = "#fbf6ea"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(text, x, y + 1);
  }

  /* Who walks the street in each section: [style A, style B] */
  const PEOPLE = [["colonial", "woman"], ["colonial", "woman"], ["continental", "woman"], ["gentleman", "lady"], ["gentleman", "lady"], ["modern", "modern2"]];
  /* people: style = colonial | woman | militia | crier | continental | gentleman | lady | modern | modern2 */
  /* act: idle | walk | march | wave | dig | drum | raise | hand | sign | carry | talk | cheer */
  function person(x, style, t, flip, act) {
    act = act || "idle";
    const ph = t / 150 + x * .013;
    const stepping = act === "walk" || act === "march" || act === "carry";
    const bob = stepping ? Math.abs(Math.sin(ph)) * 2.5 : act === "cheer" ? Math.abs(Math.sin(t / 140)) * 5 : Math.sin(t / 380 + x) * 1.2;
    const y = GROUND;
    const coat = { colonial: "#46597a", woman: "#8a4f6a", militia: "#6b5a3e", modern: "#3f7fb5", modern2: "#d0633f", crier: "#7a2e22", continental: "#2e4a7d", gentleman: "#2f3a2f", lady: "#5f79a8" }[style] || "#46597a";
    const period = style === "continental" || style === "gentleman";
    const skirt = style === "woman" || style === "lady";
    ctx.save(); ctx.translate(x, 0); if (flip) ctx.scale(-1, 1);
    softShadow(0, 28);
    ctx.lineCap = "round";
    const la = stepping ? Math.sin(ph) * (act === "march" ? 7 : 5) : 0, lift = stepping ? Math.max(0, Math.cos(ph)) * (act === "march" ? 6 : 3) : 0;
    const legs = (c1, c2) => {
      box(-7 + la, y - 26 - lift, 5, 12, c1); box(2 - la, y - 26 - (stepping ? Math.max(0, -Math.cos(ph)) * (act === "march" ? 6 : 3) : 0), 5, 12, c1);
      box(-7 + la, y - 14 - lift, 5, 14, c2); box(2 - la, y - 14 - (stepping ? Math.max(0, -Math.cos(ph)) * (act === "march" ? 6 : 3) : 0), 5, 14, c2);
    };
    if (skirt) poly([[style === "lady" ? -16 : -12, y], [style === "lady" ? 16 : 12, y], [7, y - 42], [-7, y - 42]], coat);
    else if (period) legs(style === "continental" ? "#d9c49a" : "#2b2b2b", "#f1ece0");
    else { const lc = style.startsWith("modern") ? "#2f3d57" : "#3b3024"; legs(lc, lc); }
    if (style === "gentleman") poly([[-10, y - 30 + bob], [-14, y - 12], [-2, y - 22 + bob]], coat);
    /* back arm */
    const sy = y - 46 + bob, sw = stepping ? Math.sin(ph) * .6 : Math.sin(t / 600 + x) * .06;
    const armC = shade(coat), skin = "#f0d0a8";
    const arm = (ang, len, back) => { limb(back ? -3 : 3, sy, ang, len, back ? shade(armC) : armC, 5); const hx = (back ? -3 : 3) + Math.sin(ang) * len, hy = sy + Math.cos(ang) * len; circ(hx, hy, 2.6, skin); return [hx, hy]; };
    let front = sw, back = -sw;
    if (act === "wave") front = Math.PI - .35 + Math.sin(t / 110) * .45;
    else if (act === "dig") { front = .9 + Math.sin(t / 220 + x) * .7; back = front - .25; }
    else if (act === "drum") { front = 1.1 + Math.max(0, Math.sin(t / 110)) * .6; back = 1.1 + Math.max(0, -Math.sin(t / 110)) * .6; }
    else if (act === "raise") front = Math.PI - .5;
    else if (act === "hand") front = Math.PI - .2 + Math.sin(t / 260) * .12;
    else if (act === "sign") { front = Math.PI - .3; back = Math.PI + .3; }
    else if (act === "carry") { front = 1.5; back = 1.4; }
    else if (act === "talk") front = .9 + Math.sin(t / 190 + x) * .5;
    else if (act === "cheer") { front = Math.PI - .4 + Math.sin(t / 120) * .2; back = Math.PI + .4 - Math.sin(t / 120) * .2; }
    else if (act === "march") { front = .3 + Math.sin(ph) * .2; back = -.2; }
    const bh = arm(back, 17, true);
    rr(-10, y - 50 + bob, 20, 28, 7); ctx.fillStyle = coat; ctx.fill();
    if (style === "continental") box(-2, y - 49 + bob, 4, 26, "#e8d7a8");
    if (style === "gentleman" || style === "lady") poly([[-4, y - 50 + bob], [4, y - 50 + bob], [0, y - 43 + bob]], "#fbf6ea");
    const nod = act === "talk" ? Math.sin(t / 170 + x) * 1.2 : 0;
    circ(0, y - 59 + bob + nod, 9, skin);

    [...panel.children].forEach((c2, n) => { c2.style.animation = "fadeUp .5s var(--out) " + (0.1 + n * 0.12) + "s both"; });
    stagger(page, 0.2);
    scr.appendChild(page); layer.appendChild(scr);
    again.focus({ preventScroll: true });
  }
  function sourcesBlock() {
    const SRC = GAME.sources, d = h("details", "sources");
    d.style.marginTop = "12px";
    d.appendChild(h("summary", null, UI.sourcesLabel));
    [[UI.citedLabel, SRC.cited], [UI.consultedLabel, SRC.consulted]].forEach(([lab, list]) => {
      d.appendChild(h("h2", null, lab.toUpperCase()));
      const ul = h("ul");
      list.forEach(s => { const li = h("li", null, s.text + " "); const a = h("a", null, SRC.linkText.toUpperCase()); a.href = s.url; a.target = "_blank"; a.rel = "noopener"; li.appendChild(a); ul.appendChild(li); });
      d.appendChild(ul);
    });
    return d;
  }

  /* ================= Boot ================= */
  function reset() {
    sfx.musicStop();
    hurrying = false; dir = 0; keys.l = keys.r = false; dust.length = 0;
    worldEl.classList.remove("dim", "undim");
    worldEl.querySelectorAll(".notice").forEach(n => n.remove());
    S = fresh(); S.mul = 1;
    updateHud();
    setEra(0, false);
    showStart();
  }
  buildHud();
  buildTimeline();
  resize();
  window.addEventListener("resize", resize);
  reset();
  requestAnimationFrame(frame);

  /* ================= Demo mode =================
     Open the page with ?demo at the end of the address (or press WATCH A DEMO). After one click (browsers
     only allow sound after a click), the game plays a 30 second introduction for screen recording:
     the title and central question, three founding era stops, one real decision with its cost,
     the jump into today's polling place, and a closing question. Press ESC to stop. */
  /* The demo script. Each caption is [label, text, milliseconds on screen]. */
  const DEMO = {
    clickToStart: "CLICK TO START THE DEMO",
    /* every caption stays up for its time times this; lower is faster */
    pace: 1,
    title: "PERSONAL DUTY",
    virtue: "THE CIVIC VIRTUE",
    walk: ["HOW TO PLAY", "Walk with the arrow keys. Each signpost marks a moment when your community needs you.", 3800],
    short: ["SUMMER 1774", "Parliament has closed Boston\u2019s harbor, and colonial towns are leaning on their neighbors. Your story begins here.", 4400],
    q9: [
      ["TODAY", "The founders' question returns in your own life. It is election day, you are tired, and you have homework.", 6200],
      ["YOUR CHOICE", "This time you find the balance: you learn about the candidates first, then you vote.", 3400],
      ["THE COST", "An informed vote costs time and energy, but a republic only works when citizens choose their representatives.", 5600]
    ],
    q10: [
      ["JURY DUTY", "A jury summons lands on a day you work. You can serve, ignore it, or ask the court for a new date.", 5600],
      ["YOUR CHOICE", "You ask the court for a new date, a responsible way to handle both your job and your duty.", 3200],
      ["NUANCE", "Personal duty does not mean giving up everything. It means taking your obligations seriously and handling conflicts fairly.", 5600]
    ],
    results: [
      ["YOUR RESULTS", "Your Balance Score averages all four bars, and your Community Trust Score shows how much you gave to your community.", 6000],
      ["YOUR CIVIC PERSONALITY", "The game names the pattern in your choices without calling you a good or bad citizen.", 5000],
      ["THE BIG PICTURE", "Under More Details, the game makes its final argument.", 3600]
    ],
    /* the ending, in rubric order: [label, text, ms, what to scroll to] */
    details: [
      ["THE JUDGMENT", "So how far has American society lived up to personal duty? Only partly. Americans have made real sacrifices for the common good, but the founding era asked many people to serve a community that denied them equal rights.", 9200, ".judgment"],
      ["FOUNDING ERA EVIDENCE", "Colonists boycotted British goods, drilled with militias, and debated the Constitution in public, giving up money, time, and safety.", 6800, ".ev0"],
      ["FOUNDING ERA EVIDENCE", "Yet the Declaration promised that all men are created equal while enslaved people, women, and Native Americans were denied equal rights.", 7000, ".ev1"],
      ["TODAY'S EXAMPLE", "Today the same test is voting and jury duty. Both only work when ordinary people show up, just like your choices at the polling place and the courthouse.", 7600, ".ev2"],
      ["THE ACTION", "So start with three quests this month: preregister to vote, attend one school board meeting, and volunteer two hours in your community.", 7000, ".quests"]
    ],
    q1: [
      ["STOP 1 OF 10", "Each stop is a real situation from the founding era. Read it, then choose one of three answers.", 5600],
      ["YOUR CHOICE", "You choose to help your neighbors, even though your own work falls behind.", 3000],
      ["THE COST", "Watch the four bars. Helping costs you Money, Time, and Health, but it builds Community Trust.", 5600]
    ],
    travel: ["TIME TRAVEL", "As you travel, history moves forward. Your clothes, the streets, and the people change with each era.", 3800],
    q2: [
      ["THE SOURCE", "Every question is tied to a founding document. Here it is 1775, and Patrick Henry is urging colonists to prepare.", 6000],
      ["YOUR CHOICE", "Once again you give everything and help prepare, even with a family at home.", 3200],
      ["RUNNING LOW", "Community Trust keeps climbing, but your Time is almost gone. One more big sacrifice could end the journey.", 6000]
    ],
    q3: [
      ["1776", "A boycott of British goods could hurt your shop. Thomas Paine's Common Sense is pushing colonists toward independence.", 5400],
      ["YOUR CHOICE", "You give everything again and join the boycott, even though it hurts your income.", 3600],
      ["OUT OF TIME", "Your Time just ran out. When any one of the four bars reaches zero, your journey ends.", 4600]
    ],
    lost: [
      ["YOU LOST", "This player gave everything three times in a row, so Time ran out and the journey ended.", 3800],
      ["THE LESSON", "Give everything and you burn out. Balance keeps all four bars healthy, and the same lesson applies today.", 4400]
    ],
    then: { label: "1776", text: "Colonists pledged their lives, fortunes, and honor to each other." },
    now: { label: "TODAY", text: "The pledge is yours. Will you show up?" },
    /* the start screen, in rubric order: [label, text, ms, what to scroll to] */
    start: [
      ["THE VIRTUE", "Personal duty means putting the common good ahead of your own comfort or gain when your community truly needs you, while still respecting individual rights, personal responsibilities, and fairness.", 9000, ".definition"],
      ["WHY IT MATTERED", "In 1776 the new republic had no king to command its people. Madison wrote in Federalist 55 that a republic depends on virtue in its citizens, so the nation could hold together only if ordinary people gave their time, money, and safety.", 9400, ".pledge-why"],
      ["THE LIMIT", "But that duty was never shared fairly. Enslaved people, women, and Native Americans were expected to serve and sacrifice while being denied equal rights.", 7600, ".pledge-why.limit"],
      ["YOUR ROLE", "Now you pick a name and a role. Each role starts with different supplies: the farmer is short on money, and the merchant is short on trust.", 5600]
    ],
    end1: "A community only works when everyone does their part.",
    end2: "How much are you willing to give?",
    soonTitle: "COMING SOON",
    soonSub: "TO THE APP STORE",
    download: "DOWNLOAD ON THE APP STORE"
  };
  const demoOn = /[?&]demo\b/.test(location.search);
  function lowerThird(label, text) {
    let el = document.querySelector(".demo-lower");
    if (!el) { el = h("div", "demo-lower"); document.body.appendChild(el); }
    el.innerHTML = (label ? "<b>" + esc(label) + "</b>" : "") + "<span>" + esc(text) + "</span>";
    el.classList.remove("show"); void el.offsetWidth; el.classList.add("show");
  }
  /* smoothly scroll a container so el sits near the top third of it (or to the very bottom) */
  function glide(container, el, ms, toBottom) {
    if (!container) return;
    const max = container.scrollHeight - container.clientHeight;
    let target = toBottom ? max : el ? el.getBoundingClientRect().top - container.getBoundingClientRect().top + container.scrollTop - container.clientHeight * .25 : 0;
    target = clamp(target, 0, Math.max(0, max));
    const from = container.scrollTop, t0 = performance.now();
    (function step(now) { const p2 = clamp((now - t0) / ms, 0, 1); container.scrollTop = from + (target - from) * (p2 < .5 ? 2 * p2 * p2 : 1 - Math.pow(-2 * p2 + 2, 2) / 2); if (p2 < 1) requestAnimationFrame(step); })(t0);
  }
  /* the app icon: a person saluting the United States flag, 32 by 32 pixel art */
  function saluteIcon() {
    const c = document.createElement("canvas"); c.width = 32; c.height = 32; c.className = "salute";
    const g = c.getContext("2d"), px = (x, y, w, hh, col) => { g.fillStyle = col; g.fillRect(x, y, w, hh); };
    px(0, 0, 32, 32, "#9fd3f2"); px(0, 0, 32, 6, "#b9e0f7");
    px(0, 27, 32, 5, "#5f9a4a"); px(0, 27, 32, 1, "#77b35c");
    /* flagpole and flag */
    px(6, 3, 2, 25, "#c8ccd2"); px(6, 3, 1, 25, "#e6e9ec"); px(5, 2, 4, 2, "#d4af37");
    for (let r = 0; r < 7; r++) px(8, 4 + r, 12, 1, r % 2 ? "#ffffff" : "#c8102e");
    px(8, 4, 6, 4, "#2b3a8c");
    [[9, 5], [11, 5], [13, 5], [10, 6], [12, 6]].forEach(([x, y]) => px(x, y, 1, 1, "#ffffff"));
    px(20, 5, 1, 5, "#9a0c22");
    /* the person, facing the flag */
    px(22, 24, 2, 4, "#2b2b3a"); px(25, 24, 2, 4, "#2b2b3a"); px(21, 27, 3, 1, "#1a1a1a"); px(24, 27, 3, 1, "#1a1a1a");
    px(21, 17, 7, 8, "#3c4f7a"); px(21, 17, 7, 1, "#4d64a0");
    px(22, 11, 5, 6, "#f0c8a0"); px(22, 10, 5, 2, "#4a3222"); px(26, 11, 1, 3, "#4a3222");
    px(22, 13, 1, 1, "#1a0f0f");
    /* saluting arm: shoulder, elbow out front, hand at the brow */
    px(20, 17, 2, 2, "#3c4f7a"); px(18, 15, 2, 2, "#3c4f7a"); px(19, 13, 2, 2, "#3c4f7a"); px(20, 11, 2, 2, "#f0c8a0");
    return c;
  }
  function hideLower() { const el = document.querySelector(".demo-lower"); if (el) el.classList.remove("show"); }
  function overlay(cls, html) {
    const el = h("div", "demo-overlay " + cls, html); document.body.appendChild(el);
    setTimeout(() => el.classList.add("show"), 30);
    return el;
  }
  function dropOverlay(el) { if (!el) return; el.classList.remove("show"); setTimeout(() => el.remove(), 600); }
  function runDemo() {
    document.body.classList.add("demo");
    const wait = ms => new Promise(r => setTimeout(r, ms));
    let stopped = false;
    window.addEventListener("keydown", e => { if (e.code === "Escape") { sfx.musicStop(); stopped = true; dir = 0; S.noTrigger = false; document.body.classList.remove("demo"); document.querySelectorAll(".demo-overlay, .demo-lower").forEach(n => n.remove()); } });
    const gate = overlay("demo-gate", "<button type=\"button\">" + DEMO.clickToStart + "</button>");
    gate.querySelector("button").addEventListener("click", () => { dropOverlay(gate); play(); }, { once: true });
    /* place the player just before a stop and walk in */
    function cutTo(x, next) { S.x = x; S.next = next; S.mul = .6; S.camLead = null; dust.length = 0; }
    /* show a caption and leave it up for its time */
    const hold = ms => wait(ms * DEMO.pace);
    const say = async ([label, text, ms]) => { lowerThird(label, text); await hold(ms); };
    const nextCard = async () => { dir = 1; while (!stopped && S.mode !== "card") await wait(50); dir = 0; await wait(500); };
    /* play one stop: read, move the highlight to the answer, choose, watch the cost, keep walking */
    async function stop(lines, j) {
      if (stopped) return;
      lowerThird(lines[0][0], lines[0][1]);
      const body = layer.querySelector(".card .scene-body");
      await hold(lines[0][2] * .55);
      glide(body, null, 1200, true); await hold(lines[0][2] * .45);
      for (let k2 = 1; k2 <= j; k2++) { select(k2); await wait(400); }
      lowerThird(lines[1][0], lines[1][1]); await hold(lines[1][2] - 500);
      S.cardAt = 0; choose(S.next, j); await wait(700);
      const modal = layer.querySelector(".modal"); if (modal && modal.scrollHeight > modal.clientHeight + 4) glide(modal, null, 1600, true);
      await say(lines[2]);
      if (S.proceed) S.proceed();
      await wait(400);
    }
    async function play() {
      S.noTrigger = true; TUNING.speed = 240;
      /* the virtue and its definition */
      const title = overlay("demo-title", "<small>" + DEMO.virtue + "</small><h1>" + DEMO.title + "</h1><p>" + esc(GAME.definition.text) + "</p>");
      await wait(7600); dropOverlay(title); await wait(400);
      if (stopped) return;
      /* the founders' pledge, the theme of the game */
      const T = GAME.theme;
      const pledge = overlay("demo-pledge", "<blockquote>\u201C" + esc(T.quote) + "\u201D</blockquote><cite>" + esc(T.cite.toUpperCase()) + "</cite><p>" + esc(T.line) + "</p>");
      await wait(6600); dropOverlay(pledge); await wait(400);
      if (stopped) return;
      /* the start screen: the virtue, why it mattered, and the limit, then a name and a role */
      const scr = layer.querySelector(".screen");
      for (const [label, text, ms, sel] of DEMO.start.slice(0, 3)) {
        if (stopped) return;
        glide(scr, layer.querySelector(sel), 1100); await say([label, text, ms]);
      }
      lowerThird(DEMO.start[3][0], DEMO.start[3][1]);
      const input = layer.querySelector(".name-input");
      glide(scr, input, 1000); await wait(1200);
      for (const ch of "YOU") { input.value += ch; input.dispatchEvent(new Event("input")); await wait(180); }
      await wait(400);
      const cards = layer.querySelectorAll(".char");
      glide(scr, cards[0], 1000); await wait(1300);
      cards[0].click(); await wait(1800);
      glide(scr, layer.querySelector(".page > .primary"), 1000); await wait(1200);
      if (stopped) return;
      begin(); const hint = worldEl.querySelector(".walkhint"); if (hint) hint.remove();
      await wait(700);
      /* three founding era stops, giving everything until Time runs out */
      TUNING.speed = 300; S.noTrigger = false;
      lowerThird(DEMO.walk[0], DEMO.walk[1]); await hold(DEMO.walk[2] - 800);
      S.res.time = 44; updateHud(); lowerThird(DEMO.short[0], DEMO.short[1]); await wait(1800);
      await nextCard(); await stop(DEMO.q1, 0);
      lowerThird(DEMO.travel[0], DEMO.travel[1]); await wait(1200);
      await nextCard(); await stop(DEMO.q2, 0);
      await nextCard(); await stop(DEMO.q3, 0);
      if (stopped) return;
      /* the loss, explained on the game over screen */
      await wait(700);
      const over = layer.querySelector(".screen");
      await say(DEMO.lost[0]);
      if (over) glide(over, over.querySelector(".over-lesson"), 900);
      await say(DEMO.lost[1]);
      if (stopped) return;
      hideLower();
      /* a slow dissolve from the founding era to today, starting fresh */
      const bridge = overlay("demo-bridge", "<div class=\"b1\"><b>" + DEMO.then.label + "</b><span>" + esc(DEMO.then.text) + "</span></div><div class=\"b2\"><b>" + DEMO.now.label + "</b><span>" + esc(DEMO.now.text) + "</span></div>");
      setTimeout(() => bridge.classList.add("two"), 900);
      await wait(700);
      layer.innerHTML = ""; worldEl.classList.remove("dim", "undim");
      S.res = Object.assign({}, GAME.characters[0].start); updateHud();
      S.mode = "run"; S.noTrigger = true; cutTo(SECTION_START[5] + 40, 8);
      await wait(1500); dropOverlay(bridge); await wait(300);
      if (stopped) return;
      /* today's questions, answered with balance */
      S.noTrigger = false; TUNING.speed = 260;
      await nextCard(); await stop(DEMO.q9, 2);
      await nextCard(); await stop(DEMO.q10, 2);
      if (stopped) return;
      /* ride to the end of the journey and tour the full results screen */
      hideLower(); dir = 1;
      while (!stopped && S.mode !== "end") await wait(50);
      dir = 0; await wait(2600);
      const res = layer.querySelector(".screen");
      const spots = [null, ".persona", ".more"];
      for (let n = 0; n < DEMO.results.length && !stopped; n++) {
        const el = spots[n] ? res.querySelector(spots[n]) : null;
        if (el) glide(res, el.closest(".ev") || el.closest(".panel") || el, 1300);
        await say(DEMO.results[n]);
      }
      if (stopped) return;
      /* open MORE DETAILS and walk through the verdict, the evidence, and the how to */
      const more = res.querySelector(".more"); if (more) { more.open = true; sfx.click(); }
      await wait(500);
      for (const [label, text, ms, sel] of DEMO.details) {
        if (stopped) return;
        const el = res.querySelector(sel);
        if (el) glide(res, el, 1300);
        await say([label, text, ms]);
      }
      if (stopped) return;
      hideLower();
      /* the point of the game, with the anthem */
      sfx.musicVolume(1, 1.5);
      const end = overlay("demo-end", "<p class=\"e1\">" + DEMO.end1 + "</p><p class=\"e2\">" + DEMO.end2 + "</p><small>" + DEMO.title + "</small>");
      await wait(2000);
      end.classList.add("two");
      await wait(5200);
      if (stopped) return;
      const soon = overlay("demo-soon", "<div class=\"demo-icon\"></div><h1>" + DEMO.title + "</h1><p class=\"s1\">" + DEMO.soonTitle + "</p><p class=\"s2\">" + DEMO.soonSub + "</p><span class=\"dl\">" + DEMO.download + "</span>");
      soon.querySelector(".demo-icon").appendChild(saluteIcon());
    }
  }
  if (demoOn) runDemo();

  /* Read only view of the game state for automated testing. */
  window.__duty = { get state() { return S; }, encX, endX: END_X, tuning: TUNING,
    setDir(d) { dir = d; },
    step(seconds) { for (let s = 0; s < seconds; s += 0.02) update(0.02); } };
})();
